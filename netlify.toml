# Netlify configuration for the Xiteon site.
# Netlify detects Next.js and applies its Next.js runtime (OpenNext adapter)
# automatically; no plugin needs to be installed.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Keep the Netlify Forms detection file out of search results.
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Send the www subdomain to the apex domain.
[[redirects]]
  from = "https://www.xiteon.com/*"
  to = "https://xiteon.com/:splat"
  status = 301
  force = true
